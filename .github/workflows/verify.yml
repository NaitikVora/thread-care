name: Verify Thread
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: thread_test
          POSTGRES_USER: thread_test
          POSTGRES_PASSWORD: ci_disposable_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thread_test -d thread_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:postgres
        env:
          POSTGRES_TEST_URL: postgres://thread_test:ci_disposable_test_only@127.0.0.1:5432/thread_test
